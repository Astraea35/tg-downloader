# ==============================================================================
#                 Telegram 媒体下载机器人 (Telegram Media Downloader) 配置文件模板
# ==============================================================================
# 部署说明：
# 1. 复制本文件重命名为 config.yaml：cp config.example.yaml config.yaml
# 2. 填写下方 api_id, api_hash, bot_token 以及 allowed_user_ids
# 3. 在飞牛「Docker」或终端中执行 docker-compose up -d 即可启动运行
# 4. 注意：config.yaml 已被 .gitignore 忽略，绝不会被意外上传至 GitHub
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Telegram 官方 API 凭证与机器人配置
# ------------------------------------------------------------------------------
api_id: 12345678
api_hash: "0123456789abcdef0123456789abcdef"
bot_token: "1234567890:ABCdefGHIjklMNOpqrSTUvwxYZ"

# 允许使用机器人的 Telegram 用户 ID 白名单 (数字 ID)
allowed_user_ids:
  - 123456789


# ------------------------------------------------------------------------------
# 2. 局域网网络代理设置（用于连接 Telegram 国际网络）
# ------------------------------------------------------------------------------
proxy:
  scheme: http              # 代理协议：http 或 socks5
  hostname: 192.168.1.34    # NAS 本地代理 IP（如 Mihomo / Clash 容器）
  port: 7890                # 代理端口


# ------------------------------------------------------------------------------
# 3. 监控与自动下载频道/群组设置 (点播模式留空即可)
# ------------------------------------------------------------------------------
chat: []
  # 如果想监控特定频道/群组全自动下载，取消注释：
  # - chat_id: -1001234567890
  #   last_read_message_id: 0
  #   download_filter: "1080p|4K"


# ------------------------------------------------------------------------------
# 4. 允许下载的媒体类型
# ------------------------------------------------------------------------------
media_types:
  - video       # 视频
  - photo       # 图片
  - document    # 文档/压缩包/任意格式文件
  - audio       # 音频/音乐
  - voice       # 语音消息
  - video_note  # 圆形视频备忘录


# ------------------------------------------------------------------------------
# 5. 具体文件格式/后缀过滤 (all 表示全部下载)
# ------------------------------------------------------------------------------
file_formats:
  video:
    - all
  audio:
    - all
  document:
    - all


# ------------------------------------------------------------------------------
# 6. 文件存储路径与自动分类命名规则
# ------------------------------------------------------------------------------
save_path: /app/download

file_path_prefix:
  - chat_title       # 第一层目录：群名或频道名

file_name_prefix:
  - message_id       # 消息编号（防止同名覆盖）
  - file_name        # 文件原本名称

file_name_prefix_split: " - "
date_format: "%Y_%m_%d"


# ------------------------------------------------------------------------------
# 7. 下载性能与并发控制
# ------------------------------------------------------------------------------
max_download_task: 10            # 同时下载的最大任务数
max_concurrent_transmissions: 20 # 单个大文件的多线程并发传输数


# ------------------------------------------------------------------------------
# 8. Web 控制台设置
# ------------------------------------------------------------------------------
web_host: 0.0.0.0
web_port: 5000
language: ZH                     # 界面语言：ZH (中文) / EN (英文)


# ------------------------------------------------------------------------------
# 9. 扩展插件专属配置 (Plugins Configuration)
# ------------------------------------------------------------------------------
plugins:
  # 本机 AstrBot 提供个人插件；TG 下载与消息收发继续由 NAS 处理。
  astrbot_bridge:
    enabled: false
    astrbot_url: "http://192.168.1.82:8769"
    shared_secret: ""  # 与 AstrBot telegram_nas 平台相同，至少 32 个随机字符。
    nas_download_path: "/vol1/1000/Docker/tg-downloader/downloads"

  # 动漫 BT 检索与 NAS 自动下载 (Nyaa / Sukebei / VCB-Studio)
  anime_bt:
    steam_service_url: "http://192.168.1.34:8192"
    save_path: "/vol1/1000/总和/娱乐"
    default_proxy: "http://192.168.1.34:7890"

  # Wallpaper Engine 壁纸与视频下载
  wallpaper:
    steam_service_url: "http://192.168.1.34:8192"
    save_path: "/vol1/1000/总和/娱乐/Wallpaper"

  # Twitter 媒体无水印解析下载
  twitter:
    flaresolverr_url: "http://flaresolverr:8191"

  # 哔哩哔哩总结、AI 早报和综合日报由本机 AstrBot 提供。
  # 在 telegram_nas 平台对应的 AstrBot 配置中选择个人插件。

